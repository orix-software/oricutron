firmware=3
twilighte_battery_is_full=yes
microdisc=no

; How to emulate joysticks attached
; Options are 'none', 'kbjoy1', 'kbjoy2', 'sdljoyN', 'mouse'
;twilightejoy_a = kbjoy1
;twilightejoy_b = none

; Keys to emulate joystick, set 1
; NOTE: 'fire2' is only available on telestrat
; NOTE: 'fire3' is only available on telestrat (right port)
;kbjoy1_up = 'KP8'
;kbjoy1_down = 'KP2'
;kbjoy1_left = 'KP4'
;kbjoy1_right = 'KP6'
;kbjoy1_fire1 = 'KP_ENTER'
;kbjoy1_fire2 = 'KP_PLUS'
;kbjoy1_fire3 = 'KP_MINUS'

; Keys to emulate joystick, set 2
;kbjoy2_up = 'W'
;kbjoy2_down = 'S'
;kbjoy2_left = 'A'
;kbjoy2_right = 'D'
;kbjoy2_fire1 = 'SPACE'
;kbjoy2_fire2 = 'N'
;kbjoy2_fire3 = 'LALT'

